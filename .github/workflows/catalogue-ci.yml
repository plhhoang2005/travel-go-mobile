name: Catalogue readiness contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/phase-2/catalogue/**'
      - 'test/catalogue_readiness_test.mjs'
      - '.github/workflows/catalogue-ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/phase-2/catalogue/**'
      - 'test/catalogue_readiness_test.mjs'
      - '.github/workflows/catalogue-ci.yml'
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test test/catalogue_readiness_test.mjs
