  <!-- Intelligent Standalone Execution Interceptor for Swagger UI -->
  <script>
    // In-memory Datasets
    const SWAGGER_DESTINATIONS = [
      { id: "da-nang", name: "Đà Nẵng", region: "Trung", description: "Thành phố đáng sống với biển Mỹ Khê và Cầu Vàng Bà Nà Hills.", imageUrl: "https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?w=800", coordinates: {lat: 16.0544, lng: 108.2022}, popularActivities: ["Cầu Rồng", "Bà Nà Hills", "Bãi biển Mỹ Khê"] },
      { id: "ninh-binh", name: "Ninh Bình", region: "Bắc", description: "Non nước hữu tình với Quần thể di sản thế giới Tràng An và Hang Múa.", imageUrl: "https://images.unsplash.com/photo-1528127269322-539801943592?w=800", coordinates: {lat: 20.2506, lng: 105.9744}, popularActivities: ["Đi thuyền Tràng An", "Leo Hang Múa", "Chùa Bái Đính"] },
      { id: "da-lat", name: "Đà Lạt", region: "Tây Nguyên", description: "Thành phố ngàn hoa với khí hậu se lạnh và cảnh sắc thơ mộng.", imageUrl: "https://images.unsplash.com/photo-1583417319070-4a69db38a482?w=800", coordinates: {lat: 11.9404, lng: 108.4583}, popularActivities: ["Săn mây Cầu Đất", "Hồ Xuân Hương", "Chợ đêm Đà Lạt"] },
      { id: "phu-quoc", name: "Phú Quốc", region: "Nam", description: "Đảo Ngọc thiên đường với bãi biển cát trắng và hoàng hôn rực rỡ.", imageUrl: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800", coordinates: {lat: 10.2899, lng: 103.9840}, popularActivities: ["Bãi Sao", "Sunset Sanato", "Grand World Phú Quốc"] },
      { id: "ha-noi", name: "Hà Nội", region: "Bắc", description: "Thủ đô ngàn năm văn hiến với 36 phố phường và nét ẩm thực tinh tế.", imageUrl: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800", coordinates: {lat: 21.0285, lng: 105.8542}, popularActivities: ["Hồ Gươm", "Phố Cổ", "Lăng Bác", "Văn Miếu"] },
      { id: "hue", name: "Huế", region: "Trung", description: "Cố đô cổ kính thơ mộng bên bờ sông Hương và Đại Nội uy nghiêm.", imageUrl: "https://images.unsplash.com/photo-1569154941061-e231b4725ef1?w=800", coordinates: {lat: 16.4637, lng: 107.5909}, popularActivities: ["Đại Nội Huế", "Chùa Thiên Mụ", "Lăng Khải Định"] }
    ];

    let SWAGGER_REVIEWS = [
      {
        id: "rev-001",
        tripId: "trip-ninh-binh-3n2d",
        userName: "Minh Nguyễn (Solo)",
        rating: 5,
        comment: "Lịch trình Ninh Bình 3N2Đ do AI tạo quá xuất sắc! Chi phí thực tế hết 3.8 triệu, rất chuẩn với ngân sách 4 triệu dự kiến ban đầu.",
        createdAt: "2026-11-03T14:20:00Z",
        replies: [
          { id: "rep-001", reviewId: "rev-001", userName: "Tác giả chuyến đi", comment: "Cảm ơn bạn Minh đã trải nghiệm và đánh giá!", createdAt: "2026-11-03T15:10:00Z" }
        ]
      },
      {
        id: "rev-002",
        tripId: "trip-da-nang-4n3d",
        userName: "Linh Trần (Gia đình)",
        rating: 5,
        comment: "Chuyến Đà Nẵng cả nhà 4 người chơi rất vui. Các hoạt động buổi sáng phân bổ hợp lý.",
        createdAt: "2026-11-02T09:45:00Z",
        replies: []
      }
    ];

    const SWAGGER_USERS = {
      minh_solo: {
        id: "usr-minh-01",
        email: "minh.solo@travelgo.vn",
        fullName: "Minh Nguyễn",
        role: "customer",
        roleBadge: "CUSTOMER",
        avatarUrl: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150",
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.travelgo_token_minh",
        preferences: { interests: ["nghỉ dưỡng", "ẩm thực", "check-in & chill"], typicalBudgetVnd: 4000000, travelStyle: "Solo & Khám phá văn hóa" },
        stats: { tripsCount: 5, reviewsCount: 3 }
      },
      linh_family: {
        id: "usr-linh-02",
        email: "linh.family@travelgo.vn",
        fullName: "Linh Trần",
        role: "customer",
        roleBadge: "CUSTOMER",
        avatarUrl: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150",
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.travelgo_token_linh",
        preferences: { interests: ["nghỉ dưỡng", "biển", "ẩm thực"], typicalBudgetVnd: 12000000, travelStyle: "Gia đình nghỉ dưỡng" },
        stats: { tripsCount: 8, reviewsCount: 6 }
      },
      admin: {
        id: "usr-admin-01",
        email: "admin@travelgo.vn",
        fullName: "Admin TravelGO",
        role: "admin",
        roleBadge: "ADMIN",
        avatarUrl: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150",
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.travelgo_token_admin",
        preferences: { interests: ["lịch sử", "khám phá"], typicalBudgetVnd: 5000000, travelStyle: "Quản trị viên hệ thống" },
        stats: { tripsCount: 12, reviewsCount: 15 }
      }
    };

    // Monkey-patch fetch to guarantee live execution even when server is offline
    const rawFetch = window.fetch;
    window.fetch = async function(resource, init) {
      const urlStr = typeof resource === 'string' ? resource : resource.url;
      const isApiCall = urlStr.includes('/plan-trip') || urlStr.includes('/chat') ||
                         urlStr.includes('/destinations') || urlStr.includes('/reviews') ||
                         urlStr.includes('/auth/login') || urlStr.includes('/profile');

      if (!isApiCall) {
        return rawFetch(resource, init);
      }

      // Try live server first (with 2s timeout)
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const liveResp = await rawFetch(resource, { ...init, signal: controller.signal });
        clearTimeout(timeoutId);
        if (liveResp.ok) return liveResp;
      } catch (_) {}

      // Fallback: Standalone In-Browser Core Engine
      let bodyData = {};
      if (init && init.body) {
        try { bodyData = JSON.parse(init.body); } catch (_) {}
      }

      // 1. /plan-trip
      if (urlStr.includes('/plan-trip')) {
        const dest = bodyData.destination || "Ninh Bình";
        const days = bodyData.numDays || 3;
        const people = bodyData.numPeople || 2;
        const budget = bodyData.budgetVnd || 4000000;
        const prefs = bodyData.preferences || ["nghỉ dưỡng", "ẩm thực"];

        const costPerDay = Math.round((budget * 0.85) / days);
        const planDays = [];
        for (let i = 1; i <= days; i++) {
          planDays.push({
            day: i,
            title: `Ngày ${i}: Khám phá văn hóa & danh thắng ${dest}`,
            activities: [
              { time: "08:00", title: `Thưởng thức điểm tâm & cà phê ngắm cảnh ${dest}`, cost: Math.round(costPerDay * 0.2), duration: "1.5h", location: dest },
              { time: "10:00", title: `Tham quan danh thắng nổi tiếng (${prefs[0] || 'Nghỉ dưỡng'})`, cost: Math.round(costPerDay * 0.35), duration: "2.5h", location: dest },
              { time: "14:30", title: `Trải nghiệm check-in & phong vị bản địa`, cost: Math.round(costPerDay * 0.25), duration: "2.0h", location: dest },
              { time: "18:30", title: `Ăn tối và thưởng thức ẩm thực đêm`, cost: Math.round(costPerDay * 0.2), duration: "2.0h", location: dest }
            ]
          });
        }

        const planResp = {
          title: `Chuyến đi ${dest} ${days} Ngày ${days - 1} Đêm`,
          destination: dest,
          numDays: days,
          numPeople: people,
          totalCost: Math.round(budget * 0.85),
          days: planDays
        };

        return new Response(JSON.stringify(planResp), {
          status: 200,
          headers: { 'Content-Type': 'application/json', 'X-TravelGo-Engine': 'Local AI Qwen3 Engine' }
        });
      }

      // 2. /chat
      if (urlStr.includes('/chat')) {
        const msg = bodyData.message || "Xin chào";
        const reply = {
          reply: `Trợ lý AI TravelGO: Về câu hỏi "${msg}", chúng tôi khuyến nghị bạn nên đặt vé sớm, chuẩn bị trang phục phù hợp với thời tiết và ưu tiên trải nghiệm ẩm thực truyền thống!`,
          model: "qwen3:4b-instruct-2507-q4_K_M"
        };
        return new Response(JSON.stringify(reply), {
          status: 200,
          headers: { 'Content-Type': 'application/json', 'X-TravelGo-Engine': 'Ollama Local Chat' }
        });
      }

      // 3. /destinations
      if (urlStr.includes('/destinations')) {
        return new Response(JSON.stringify({ total: SWAGGER_DESTINATIONS.length, destinations: SWAGGER_DESTINATIONS }), {
          status: 200,
          headers: { 'Content-Type': 'application/json', 'X-TravelGo-Engine': 'Catalogue Database' }
        });
      }

      // 4. /reviews/reply
      if (urlStr.includes('/reviews/reply')) {
        const rep = {
          id: `rep-${Date.now().toString().slice(-4)}`,
          reviewId: bodyData.reviewId || "rev-001",
          userName: bodyData.userName || "Thành viên TravelGO",
          comment: bodyData.comment || "Cảm ơn bạn đã chia sẻ!",
          createdAt: new Date().toISOString()
        };
        return new Response(JSON.stringify({ message: "Phản hồi đánh giá thành công", reply: rep }), {
          status: 201,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      // 5. /reviews
      if (urlStr.includes('/reviews')) {
        if (init && init.method === 'POST') {
          const rev = {
            id: `rev-${Date.now().toString().slice(-4)}`,
            tripId: bodyData.tripId || "trip-ninh-binh-3n2d",
            userName: bodyData.userName || "Minh Nguyễn (Bạn)",
            rating: bodyData.rating || 5,
            comment: bodyData.comment || "Chuyến đi tuyệt vời!",
            createdAt: new Date().toISOString(),
            replies: []
          };
          SWAGGER_REVIEWS.unshift(rev);
          return new Response(JSON.stringify({ message: "Tạo đánh giá thành công", review: rev }), {
            status: 201,
            headers: { 'Content-Type': 'application/json' }
          });
        }
        return new Response(JSON.stringify({ total: SWAGGER_REVIEWS.length, reviews: SWAGGER_REVIEWS }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      // 6. /auth/login
      if (urlStr.includes('/auth/login')) {
        const persona = bodyData.persona || "minh_solo";
        const u = SWAGGER_USERS[persona] || SWAGGER_USERS["minh_solo"];
        return new Response(JSON.stringify({ message: "Đăng nhập thành công", token: u.token, user: u }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      // 7. /profile
      if (urlStr.includes('/profile')) {
        return new Response(JSON.stringify(SWAGGER_USERS["minh_solo"]), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      return rawFetch(resource, init);
    };

    // Swagger OpenAPI Specification
    const spec = {
      "openapi": "3.0.3",
      "info": {
        "title": "TravelGO Mobile Backend & AI Gateway API",
        "version": "1.0.0",
        "description": "Tài liệu đặc tả kỹ thuật chính thức toàn bộ hệ thống Web API của đồ án TravelGO (Mobile Client, Supabase RESTful Core, và Trợ lý Trí tuệ nhân tạo Local AI Qwen3)."
      },
      "servers": [
        {
          "url": "http://localhost:8080",
          "description": "Local API Gateway (Khi chạy tools/start_web_demo.bat)"
        },
        {
          "url": "https://plhhoang2005.github.io/travel-go-mobile/api-playground",
          "description": "Live Public Web Demo (GitHub Pages Engine)"
        }
      ],
      "tags": [
        { "name": "AI Services", "description": "Trí tuệ nhân tạo lập lịch trình và đàm thoại tư vấn du lịch" },
        { "name": "Destinations", "description": "Danh mục điểm đến, toạ độ GPS và hình ảnh" },
        { "name": "Community Reviews", "description": "Đánh giá cộng đồng và phản hồi bình luận chuyến đi" },
        { "name": "Auth & Profile", "description": "Xác thực JWT và quản lý hồ sơ cá nhân hóa" }
      ],
      "paths": {
        "/plan-trip": {
          "post": {
            "tags": ["AI Services"],
            "summary": "Tạo lịch trình du lịch thông minh bằng AI",
            "description": "Tiếp nhận điểm đến, số ngày, số người, ngân sách và sở thích du lịch; phân bổ ngân sách tối ưu và sắp xếp hoạt động theo từng ngày.",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/PlanTripRequest"
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Tạo lịch trình thành công",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/PlanTripResponse"
                    }
                  }
                }
              }
            }
          }
        },
        "/chat": {
          "post": {
            "tags": ["AI Services"],
            "summary": "Chatbot tư vấn du lịch thông minh",
            "description": "Hỏi đáp tự nhiên về kinh nghiệm du lịch, ẩm thực bản địa, thời gian khởi hành tối ưu và kinh nghiệm tiết kiệm chi phí.",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {
                      "message": { "type": "string", "example": "Gợi ý 3 món ăn đặc sản không thể bỏ qua ở Ninh Bình?" }
                    },
                    "required": ["message"]
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Câu trả lời từ trợ lý AI",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "reply": { "type": "string" },
                        "model": { "type": "string", "example": "qwen3:4b-instruct-2507-q4_K_M" }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/destinations": {
          "get": {
            "tags": ["Destinations"],
            "summary": "Lấy danh mục điểm đến du lịch",
            "description": "Truy xuất danh sách địa danh chính thức kèm vùng miền, toạ độ GPS, mô tả và các hoạt động trải nghiệm đặc sắc.",
            "parameters": [
              {
                "name": "q",
                "in": "query",
                "description": "Từ khóa tìm kiếm theo tên hoặc mô tả",
                "schema": { "type": "string" }
              },
              {
                "name": "region",
                "in": "query",
                "description": "Lọc theo vùng miền (Bắc, Trung, Nam, Tây Nguyên)",
                "schema": { "type": "string" }
              }
            ],
            "responses": {
              "200": {
                "description": "Danh sách điểm đến",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "total": { "type": "integer", "example": 6 },
                        "destinations": {
                          "type": "array",
                          "items": { "$ref": "#/components/schemas/Destination" }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/reviews": {
          "get": {
            "tags": ["Community Reviews"],
            "summary": "Lấy danh sách đánh giá cộng đồng",
            "description": "Truy xuất danh sách các bài đánh giá chuyến đi kèm số sao, bình luận, avatar và danh sách phản hồi (replies).",
            "parameters": [
              {
                "name": "trip_id",
                "in": "query",
                "description": "ID chuyến đi cần lọc đánh giá",
                "schema": { "type": "string" }

                      "properties": {
                        "total": { "type": "integer", "example": 3 },
                        "reviews": {

                          "items": { "$ref": "#/components/schemas/Review" }

                }
              }
            }
          },
          "post": {
            "tags": ["Community Reviews"],
            "summary": "Gửi đánh giá chuyến đi mới",
            "description": "Đăng tải nhận xét và xếp hạng điểm sao (1 - 5 sao) cho chuyến đi đã trải nghiệm.",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/CreateReviewRequest"
                  }
                }
              }
            },
            "responses": {
              "201": {
                "description": "Tạo đánh giá thành công",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "message": { "type": "string", "example": "Tạo đánh giá thành công" },
                        "review": { "$ref": "#/components/schemas/Review" }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/reviews/reply": {
          "post": {
            "tags": ["Community Reviews"],
            "summary": "Phản hồi/Trả lời một bài đánh giá",
            "description": "Cho phép người dùng hoặc tác giả chuyến đi gửi bình luận trả lời trực tiếp vào một review có sẵn.",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/CreateReplyRequest"
                  }
                }
              }
            },
            "responses": {
              "201": {
                "description": "Phản hồi thành công",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "message": { "type": "string", "example": "Phản hồi đánh giá thành công" },
                        "reply": { "$ref": "#/components/schemas/Reply" }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/auth/login": {
          "post": {
            "tags": ["Auth & Profile"],
            "summary": "Xác thực đăng nhập tài khoản",
            "description": "Đăng nhập bằng Email/Mật khẩu hoặc chuyển đổi Persona mẫu; trả về JWT token và thông tin hồ sơ người dùng.",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {
                      "persona": { "type": "string", "enum": ["minh_solo", "linh_family", "admin"], "example": "minh_solo" },
                      "email": { "type": "string", "example": "minh.solo@travelgo.vn" }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Đăng nhập thành công",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "token": { "type": "string" },
                        "user": { "$ref": "#/components/schemas/UserProfile" }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/profile": {
          "get": {
            "tags": ["Auth & Profile"],
            "summary": "Lấy thông tin hồ sơ & sở thích du lịch",
            "description": "Truy xuất thông tin cá nhân, vai trò (Customer/Admin), thống kê chuyến đi và cấu hình TravelPreferences.",
            "responses": {
              "200": {
                "description": "Thông tin hồ sơ",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/UserProfile"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "components": {
        "schemas": {
          "PlanTripRequest": {
            "type": "object",
            "required": ["destination", "numDays", "numPeople", "budgetVnd"],
            "properties": {
              "destination": { "type": "string", "example": "Ninh Bình" },
              "numDays": { "type": "integer", "example": 3 },
              "numPeople": { "type": "integer", "example": 2 },
              "budgetVnd": { "type": "integer", "example": 4000000 },
              "preferences": {
                "type": "array",
                "items": { "type": "string" },
                "example": ["nghỉ dưỡng", "ẩm thực", "check-in & chill"]
              }
            }
          },
          "PlanTripResponse": {
            "type": "object",
            "properties": {
              "title": { "type": "string", "example": "Chuyến đi Ninh Bình 3N" },
              "destination": { "type": "string", "example": "Ninh Bình" },
              "totalCost": { "type": "integer", "example": 3800000 },
              "days": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "day": { "type": "integer", "example": 1 },
                    "title": { "type": "string", "example": "Ngày 1: Khám phá các điểm nổi bật" },
                    "activities": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "time": { "type": "string", "example": "08:00" },
                          "title": { "type": "string", "example": "Tham quan Quần thể Tràng An" },
                          "cost": { "type": "integer", "example": 250000 },
                          "duration": { "type": "string", "example": "3.0h" },
                          "location": { "type": "string", "example": "Tràng An, Ninh Bình" }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "Destination": {
            "type": "object",
            "properties": {
              "id": { "type": "string", "example": "ninh-binh" },
              "name": { "type": "string", "example": "Ninh Bình" },
              "region": { "type": "string", "example": "Bắc" },
              "description": { "type": "string" },
              "imageUrl": { "type": "string" },
              "coordinates": {
                "type": "object",
                "properties": {
                  "lat": { "type": "number", "example": 20.2506 },
                  "lng": { "type": "number", "example": 105.9744 }
                }
              },
              "popularActivities": {
                "type": "array",
                "items": { "type": "string" }
              }
            }
          },
          "Review": {
            "type": "object",
            "properties": {
              "id": { "type": "string", "example": "rev-001" },
              "tripId": { "type": "string", "example": "trip-ninh-binh-3n2d" },
              "userName": { "type": "string", "example": "Minh Nguyễn (Solo)" },
              "rating": { "type": "integer", "minimum": 1, "maximum": 5, "example": 5 },
              "comment": { "type": "string", "example": "Lịch trình Ninh Bình 3N2Đ do AI tạo quá xuất sắc!" },
              "createdAt": { "type": "string", "format": "date-time" },
              "replies": {
                "type": "array",
                "items": { "$ref": "#/components/schemas/Reply" }
              }
            }
          },
          "CreateReviewRequest": {
            "type": "object",
            "required": ["tripId", "userName", "rating", "comment"],
            "properties": {
              "tripId": { "type": "string", "example": "trip-ninh-binh-3n2d" },
              "userName": { "type": "string", "example": "Minh Nguyễn (Bạn)" },
              "rating": { "type": "integer", "minimum": 1, "maximum": 5, "example": 5 },
              "comment": { "type": "string", "example": "Chuyến đi rất vui và tiết kiệm!" }
            }
          },
          "Reply": {
            "type": "object",
            "properties": {
              "id": { "type": "string", "example": "rep-001" },
              "reviewId": { "type": "string", "example": "rev-001" },
              "userName": { "type": "string", "example": "Tác giả chuyến đi" },
              "comment": { "type": "string", "example": "Cảm ơn bạn đã trải nghiệm!" },
              "createdAt": { "type": "string", "format": "date-time" }
            }
          },
          "CreateReplyRequest": {
            "type": "object",
            "required": ["reviewId", "userName", "comment"],
            "properties": {
              "reviewId": { "type": "string", "example": "rev-001" },
              "userName": { "type": "string", "example": "Thành viên TravelGO" },
              "comment": { "type": "string", "example": "Bạn đi vào mùa nào thế ạ?" }
            }
          },
          "UserProfile": {
            "type": "object",
            "properties": {
              "id": { "type": "string", "example": "usr-minh-01" },
              "email": { "type": "string", "example": "minh.solo@travelgo.vn" },
              "fullName": { "type": "string", "example": "Minh Nguyễn" },
              "role": { "type": "string", "enum": ["customer", "admin"], "example": "customer" },
              "roleBadge": { "type": "string", "example": "CUSTOMER" },
              "avatarUrl": { "type": "string" },
              "preferences": {
                "type": "object",
                "properties": {
                  "interests": { "type": "array", "items": { "type": "string" } },
                  "typicalBudgetVnd": { "type": "integer", "example": 4000000 },
                  "travelStyle": { "type": "string", "example": "Solo & Khám phá văn hóa" }
                }
              },
              "stats": {
                "type": "object",
                "properties": {
                  "tripsCount": { "type": "integer", "example": 5 },
                  "reviewsCount": { "type": "integer", "example": 3 }
                }
              }
            }
          }
        }
      }
    };

    window.onload = function() {
      SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
